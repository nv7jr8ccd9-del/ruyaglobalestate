<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Rüya Global Estate</title><style>body{font-family:Arial;background:#050505;color:#eee;margin:0;padding:20px}.box{max-width:820px;margin:auto;border:1px solid #3b3115;border-radius:18px;padding:18px;background:#0d0d0d}input,textarea,select{width:100%;padding:13px;margin:8px 0;background:#111;color:#fff;border:1px solid #5b4b22;border-radius:10px}button{padding:13px 18px;border:0;border-radius:12px;background:#d6af42;font-weight:800;margin:6px 6px 6px 0}.item{border-top:1px solid #333;padding:10px 0}a{color:#f5dc7a}</style></head><body><div class="box"><h1>Rüya Global Estate Admin</h1><p>Şifre: <b>ruya2026</b></p><input id="pass" placeholder="Password"><button onclick="login()">Login</button><div id="panel" style="display:none"><h2>Add Listing</h2><select id="type"><option value="villas">Villa</option><option value="land">Land</option><option value="projects">Project</option></select><input id="title" placeholder="Title"><input id="location" placeholder="Location"><input id="price" placeholder="Price"><input id="img" placeholder="Image URL"><textarea id="desc" placeholder="Description"></textarea><button onclick="add()">Add Listing</button><h2>About Us</h2><textarea id="about" placeholder="About text"></textarea><input id="photo" placeholder="Your photo URL"><button onclick="saveAbout()">Save About</button><h2>Listings</h2><div id="list"></div><p><a href="../index.html">Back to site</a></p></div></div><script>const DEF=[{type:'villas',title:'Luxury Sea View Villa',location:'Kocaali, Sakarya',price:'10,500,000 TL',desc:'Premium 4+1 villa with garden, pool and investment value.',img:'https://images.unsplash.com/photo-1613977257363-707ba9348227?q=80&w=1200'}];function props(){return JSON.parse(localStorage.getItem('ruya_properties')||JSON.stringify(DEF))}function save(a){localStorage.setItem('ruya_properties',JSON.stringify(a));render()}function login(){if(pass.value==='ruya2026'){panel.style.display='block';render();about.value=localStorage.getItem('ruya_about')||'';photo.value=localStorage.getItem('ruya_photo')||''}else alert('Wrong password')}function add(){let a=props();a.push({type:type.value,title:title.value,location:location.value,price:price.value,img:img.value,desc:desc.value});save(a)}function del(i){let a=props();a.splice(i,1);save(a)}function saveAbout(){localStorage.setItem('ruya_about',about.value);localStorage.setItem('ruya_photo',photo.value);alert('Saved')}function render(){list.innerHTML=props().map((p,i)=>`<div class=item><b>${p.title}</b><br>${p.type} • ${p.price}<br><button onclick="del(${i})">Delete</button></div>`).join('')}</script></body></html>
