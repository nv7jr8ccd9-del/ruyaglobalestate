<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Rüya Global Estate</title><link rel="stylesheet" href="../style.css"><style>.admin{padding:30px 0}.admin input,.admin textarea,.admin select{width:100%;padding:12px;margin:7px 0 14px;border-radius:10px;border:1px solid var(--line);background:#090909;color:white}.small{font-size:13px;color:#bbb}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.danger{border-color:#9b3333;color:#ffb0b0}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main class="admin wrap"><h1 class="title">Admin Panel</h1><div id="login"><p>Şifre:</p><input id="pw" type="password"><button class="btn primary" onclick="login()">Giriş</button><p class="small">Şifre: ruya2026</p></div><div id="panel" style="display:none"><h2>Site Yazıları</h2><label>Başlık</label><input id="heroTitle"><label>Önsöz / Ana yazı</label><textarea id="heroText" rows="4"></textarea><label>About Us yazısı</label><textarea id="aboutText" rows="5"></textarea><div class="row"><div><label>Telefon</label><input id="phone"></div><div><label>WhatsApp numarası</label><input id="whatsapp"></div></div><label>Google Analytics kodu / Measurement ID</label><input id="analytics" placeholder="G-XXXXXXXXXX"><label>About fotoğraf linki</label><input id="photo" placeholder="https://..."><button class="btn primary" onclick="saveMain()">Yazıları Kaydet</button><hr><h2>İlanlar</h2><div id="props"></div><button class="btn" onclick="addProp()">Yeni İlan Ekle</button><button class="btn primary" onclick="saveProps()">İlanları Kaydet</button><hr><button class="btn" onclick="exportBackup()">Export Backup</button><input type="file" id="importFile" onchange="importBackup(event)"><p><a class="btn" href="../index.html">Siteye Dön</a></p></div></main><script src="../script.js"></script><script>
function login(){if(document.getElementById('pw').value==='ruya2026'){login.style;document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';loadAdmin()}else alert('Şifre yanlış')}
function loadAdmin(){let d=data();['heroTitle','heroText','aboutText','phone','whatsapp','analytics','photo'].forEach(id=>document.getElementById(id).value=d[id]||'');renderAdminProps(d.properties)}
function saveMain(){let d=data();['heroTitle','heroText','aboutText','phone','whatsapp','analytics','photo'].forEach(id=>d[id]=document.getElementById(id).value);save(d);alert('Kaydedildi')}
function renderAdminProps(arr){props.innerHTML=arr.map((p,i)=>`<div class="cardBody card" style="margin:12px 0"><select data-k="type" data-i="${i}"><option ${p.type==='Villa'?'selected':''}>Villa</option><option ${p.type==='Land'?'selected':''}>Land</option><option ${p.type==='Project'?'selected':''}>Project</option></select><input data-k="title" data-i="${i}" value="${p.title||''}" placeholder="Başlık"><input data-k="location" data-i="${i}" value="${p.location||''}" placeholder="Konum"><input data-k="price" data-i="${i}" value="${p.price||''}" placeholder="Fiyat"><input data-k="details" data-i="${i}" value="${p.details||''}" placeholder="Detay"><input data-k="img" data-i="${i}" value="${p.img||''}" placeholder="Fotoğraf linki"><textarea data-k="desc" data-i="${i}" placeholder="Açıklama">${p.desc||''}</textarea><button class="btn danger" onclick="delProp(${i})">Sil</button></div>`).join('')}
function collect(){let d=data();let arr=d.properties.map(x=>({...x}));document.querySelectorAll('[data-k]').forEach(e=>arr[e.dataset.i][e.dataset.k]=e.value);return arr}
function saveProps(){let d=data();d.properties=collect();save(d);alert('İlanlar kaydedildi')}
function addProp(){let d=data();d.properties=collect();d.properties.push({type:'Villa',title:'New Property',location:'Kocaali, Sakarya',price:'Contact',details:'',img:'https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&w=1200&q=80',desc:''});save(d);renderAdminProps(d.properties)}
function delProp(i){let d=data();d.properties=collect();d.properties.splice(i,1);save(d);renderAdminProps(d.properties)}
function exportBackup(){let blob=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ruya-backup.json';a.click()}
function importBackup(e){let f=e.target.files[0];let r=new FileReader();r.onload=()=>{localStorage.setItem('rgeData',r.result);alert('Yüklendi');location.reload()};r.readAsText(f)}
</script></body></html>
